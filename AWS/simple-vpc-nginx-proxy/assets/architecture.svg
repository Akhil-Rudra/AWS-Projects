<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS VPC architecture with ALB, public NGINX proxy, and private Python app server</title>
  <desc id="desc">End users reach an internet-facing Application Load Balancer in public subnets. The ALB forwards traffic to a public NGINX proxy EC2 instance, which forwards traffic to a private EC2 app server running Python's built-in HTTP server.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1100" height="720" fill="#ffffff" />

  <rect x="24" y="24" width="1052" height="672" fill="#fbfdff" stroke="#2563eb" stroke-width="2" />
  <text x="56" y="56" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">AWS Region</text>

  <rect x="50" y="135" width="130" height="70" rx="8" fill="#eef6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
  <text x="115" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">End Users</text>
  <text x="115" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">Browser</text>

  <rect x="480" y="82" width="160" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)" />
  <text x="560" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Internet</text>
  <text x="560" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Gateway</text>

  <rect x="210" y="168" width="830" height="470" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
  <text x="230" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#15803d">VPC: simple-vpc-nginx-vpc</text>
  <text x="230" y="224" font-family="Arial, sans-serif" font-size="14" fill="#475569">CIDR: 10.0.0.0/16</text>

  <rect x="250" y="250" width="350" height="340" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="7 6" />
  <rect x="650" y="250" width="350" height="340" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="7 6" />
  <text x="425" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0369a1">Availability Zone 1</text>
  <text x="825" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0369a1">Availability Zone 2</text>

  <rect x="282" y="302" width="286" height="118" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" />
  <rect x="682" y="302" width="286" height="118" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" />
  <text x="300" y="327" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d">Public Subnet 1</text>
  <text x="300" y="348" font-family="Arial, sans-serif" font-size="13" fill="#475569">10.0.1.0/24</text>
  <text x="700" y="327" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#15803d">Public Subnet 2</text>
  <text x="700" y="348" font-family="Arial, sans-serif" font-size="13" fill="#475569">10.0.2.0/24</text>

  <rect x="282" y="454" width="286" height="108" fill="#eff6ff" stroke="#0284c7" stroke-width="2" />
  <rect x="682" y="454" width="286" height="108" fill="#eff6ff" stroke="#0284c7" stroke-width="2" />
  <text x="300" y="480" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0369a1">Private Subnet 1</text>
  <text x="300" y="501" font-family="Arial, sans-serif" font-size="13" fill="#475569">10.0.11.0/24</text>
  <text x="700" y="480" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0369a1">Private Subnet 2</text>
  <text x="700" y="501" font-family="Arial, sans-serif" font-size="13" fill="#475569">10.0.12.0/24</text>

  <rect x="448" y="338" width="304" height="58" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)" />
  <text x="600" y="361" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4c1d95">Application Load Balancer</text>
  <text x="600" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Internet-facing, public subnets</text>

  <rect x="320" y="522" width="205" height="56" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)" />
  <text x="422" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Public EC2</text>
  <text x="422" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">NGINX Reverse Proxy</text>

  <rect x="720" y="522" width="205" height="56" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)" />
  <text x="822" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Private EC2</text>
  <text x="822" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Python HTTP App</text>

  <text x="825" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748b">Private Subnet 2 reserved for HA</text>

  <rect x="250" y="620" width="350" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="425" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">Private route table: local VPC route only</text>
  <rect x="650" y="620" width="350" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="825" y="642" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">Public route: 0.0.0.0/0 -> Internet Gateway</text>

  <path d="M180 170 C275 170, 390 113, 480 113" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="300" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">HTTP :80</text>

  <path d="M560 144 C560 215, 585 285, 600 338" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" />
  <path d="M560 396 C520 445, 465 485, 430 522" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="494" y="455" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">Target group :80</text>

  <path d="M525 550 C600 550, 645 550, 720 550" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="622" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">Private HTTP :80</text>

  <path d="M720 570 C645 604, 535 604, 525 570" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-blue)" />
  <text x="625" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1d4ed8">Response</text>

  <rect x="290" y="680" width="520" height="26" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5" />
  <text x="550" y="698" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9f1239">Security groups: ALB -> Proxy on 80, Proxy -> Private App on 80</text>
</svg>
